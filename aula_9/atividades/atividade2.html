<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Heróis e Vilões</title>
  </head>
  <body>
    <h1>Spread com Personagens</h1>

    <script>
      const herois = ["Homem-Aranha", "Mulher-Maravilha", "Pantera Negra"];

      const viloes = ["Coringa", "Thanos", "Loki"];

      const personagens = [...herois, ...viloes];

      console.log("Heróis:", herois);
      console.log("Vilões:", viloes);
      console.log("Todos os personagens:", personagens);
    </script>
  </body>
</html>
