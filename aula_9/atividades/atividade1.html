<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spread Syntax</title>
  </head>
  <body>
    <h1>Testando Spread</h1>

    <script>
      const frutas = ["Abacaxi", "Kiwi", "Melancia"];

      const frutasExtras = [...frutas, "Pera", "Amora"];

      console.log("Frutas originais:", frutas);
      console.log("Frutas com extras:", frutasExtras);
    </script>
  </body>
</html>
